name: Weekly Training Snapshot

on:
  schedule:
    # 03:00 UTC every Monday — after Sunday's daily-update has run and
    # page_metrics for the prior week has been ingested
    - cron: '0 3 * * 1'
  workflow_dispatch: # allow manual trigger

jobs:
  training-snapshot:
    name: Create training examples and label closed windows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create training snapshot and back-fill labels
        run: npx tsx scripts/create-training-examples.ts

      - name: Summary
        run: echo "Training snapshot complete $(date -u +%Y-%m-%dT%H:%M:%SZ)"
